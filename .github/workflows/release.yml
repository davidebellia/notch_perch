name: Build prototype release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notchperch-prototype-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and verify app signature
        run: |
          ./build-app.sh
          codesign --verify --deep --strict build/NotchPerch.app
          plutil -lint build/NotchPerch.app/Contents/Info.plist
      - name: Run file-transfer fixture tests
        run: |
          mkdir -p build/tests /private/tmp/notchperch-swift-cache
          swiftc -module-cache-path /private/tmp/notchperch-swift-cache \
            -parse-as-library \
            sources/notchperch/ShelfCore.swift \
            sources/notchperch/VerifiedFileMove.swift \
            tests/VerifiedFileMoveTests.swift \
            -framework AppKit -o build/tests/VerifiedFileMoveTests
          ./build/tests/VerifiedFileMoveTests
      - name: Run pointer geometry regression tests
        run: |
          swiftc -module-cache-path /private/tmp/notchperch-swift-cache \
            -parse-as-library sources/notchperch/ShelfPointerGeometry.swift \
            tests/ShelfPointerGeometryTests.swift -framework AppKit \
            -o build/tests/ShelfPointerGeometryTests
          ./build/tests/ShelfPointerGeometryTests
      - name: Package Apple silicon app
        run: |
          mkdir -p build/release
          ditto -c -k --keepParent build/NotchPerch.app build/release/NotchPerch-0.1.0-macOS-arm64.zip
          cd build/release
          shasum -a 256 NotchPerch-0.1.0-macOS-arm64.zip > SHA256SUMS.txt
      - name: Upload assets and publish prototype
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.0 \
            build/release/NotchPerch-0.1.0-macOS-arm64.zip \
            build/release/SHA256SUMS.txt \
            --clobber
          gh release edit v0.1.0 \
            --notes-file docs/release-notes-v0.1.0.md \
            --draft=false --prerelease
